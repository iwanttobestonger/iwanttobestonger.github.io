<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝藏猎人</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-size: cover; /* 确保背景图片覆盖整个浏览器窗口 */
            background-position: center;
            background-repeat: no-repeat; /* 防止背景图片重复 */
            background-image: url('images/2.jpg'); /* 修改初始背景图片路径 */
            color: white; /* 将字体颜色改为白色 */
        }
        h1 {
            font-size: 3em; /* 调大标题字号 */
        }
        #result {
            font-size: 2em; /* 调大结果显示的字号 */
            margin-top: 20px;
            transition: opacity 1s;
        }
        .fade {
            opacity: 0;
        }
        .hidden {
            display: none;
        }
        button {
            font-size: 1.5em; /* 调大按钮的字号 */
        }
        input {
            font-size: 1.5em; /* 调大输入框的字号 */
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(6, 50px);
            grid-template-rows: repeat(6, 50px);
            gap: 5px;
            justify-content: center;
            margin-top: 20px;
        }
        .cell {
            width: 50px;
            height: 50px;
            background-color: lightgray;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            position: relative;
        }
        .guard {
            background-color: red;
        }
        .player img, .treasure img {
            width: 100%;
            height: 100%;
        }
        #treasureImage {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(0deg);
            width: 0;
            height: 0;
            transition: width 1s, height 1s, transform 1s;
        }
        #treasureImage.show {
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%) rotate(360deg);
        }
        #popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            color: black;
            padding: 20px;
            border: 2px solid black;
            z-index: 1000;
        }
        #popup.show {
            display: block;
        }
        .game-info {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 800px;
        }
        
        .scroll-text {
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            line-height: 1.6;
            white-space: pre-line;
        }
        
        /* 修改音乐控制按钮样式 */
        #audioControl {
            position: fixed;
            bottom: 20px;  /* 改为bottom */
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;  /* 添加鼠标指针样式 */
            transition: background 0.3s;  /* 添加过渡效果 */
        }
        
        #audioControl:hover {
            background: rgba(255, 255, 255, 0.3);  /* 添加悬停效果 */
        }
        
        #audioControl button {
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <div id="audioControl">
        <button onclick="audioController.bgMusic.paused ? audioController.playBackground() : audioController.stopBackground()">
            🎵 背景音乐
        </button>
    </div>
    <h1>宝藏猎人</h1>
    <button id="decodeButton">解码古代文字</button>
    <div id="riddleSection" class="hidden">
        <p>谜语：“雨天没有阴天有，田里没有湖里有，河水没有潮水有。”</p>
        <input type="text" id="riddleAnswer" placeholder="请输入谜底">
        <button id="submitRiddle">提交答案</button>
        <button id="helpButton">寻求帮助</button>
    </div>
    <button id="searchButton" class="hidden">搜索神庙</button>
    <button id="openBoxButton" class="hidden">打开宝箱</button>
    <div id="grid" class="hidden"></div>
    <p id="result"></p>
    <img id="treasureImage" src="images/6.jpg" alt="Treasure">
    <div id="popup">恭喜!你找到了传说中的宝藏!</div>

    <script src="treasure.js"></script>
</body>
</html>
